name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - name: Checkout lumio-app
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          path: lumio-app

      # lumio-app consumes @lumio/ui, @lumio/sdk and @lumio/shared via pnpm
      # `link:` to a sibling lumio-sdk checkout, so CI must lay them out as
      # siblings and build the SDK before the app.
      - name: Checkout lumio-sdk (sibling)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: lumio-network/lumio-sdk
          path: lumio-sdk

      - name: Resolve SDK revision
        id: sdk-revision
        run: echo "commit=$(git -C lumio-sdk rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache SDK build artifacts
        id: sdk-build-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            lumio-sdk/packages/sdk/dist
            lumio-sdk/packages/shared/dist
            lumio-sdk/packages/ui/dist
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-lumio-sdk-build-${{ hashFiles('lumio-sdk/pnpm-lock.yaml') }}-${{ steps.sdk-revision.outputs.commit }}

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 9.12.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Resolve pnpm store path
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ runner.os }}-node-${{ matrix.node-version }}-pnpm-${{ hashFiles('lumio-sdk/pnpm-lock.yaml', 'lumio-app/pnpm-lock.yaml') }}

      - name: Build the SDK (provides the linked @lumio/* packages)
        if: steps.sdk-build-cache.outputs.cache-hit != 'true'
        working-directory: lumio-sdk
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Install app dependencies
        working-directory: lumio-app
        run: pnpm install --frozen-lockfile

      - name: Format check
        working-directory: lumio-app
        run: pnpm format:check

      - name: Lint
        working-directory: lumio-app
        run: pnpm lint

      - name: Typecheck
        working-directory: lumio-app
        run: pnpm typecheck

      - name: Build
        working-directory: lumio-app
        run: pnpm build

      - name: Test
        working-directory: lumio-app
        run: pnpm test

      - name: Test API
        working-directory: lumio-app/apps/api
        run: pnpm test:cov

      - name: Upload API coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-jest-coverage
          path: lumio-app/apps/api/coverage/
          if-no-files-found: ignore
          retention-days: 14
        continue-on-error: true
